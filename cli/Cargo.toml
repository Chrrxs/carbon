[package]
name = "carbon"
authors = ["Dervex", "Chrrxs"]
description = "Lossless mergeable whole-place source for Roblox"
repository = "https://github.com/Chrrxs/carbon"
homepage = "https://github.com/Chrrxs/carbon"
readme = "../README.md"
license = "MIT"
publish = false
version.workspace = true
edition = "2021"
build = "build.rs"

[[bin]]
name = "carbon"
path = "src/main.rs"

[[bin]]
name = "carbon-qualify"
path = "src/bin/carbon-qualify/main.rs"

[lib]
name = "carbon"
path = "src/lib.rs"

[dependencies]
rbx_binary = { version = "2.0.1", path = "crates/rbx_binary" }
rbx_dom_weak = "4.1.0"
rbx_reflection = "7.0.0"

config-derive = { version = "*", path = "crates/config-derive" }
profiling = { version = "*", path = "crates/profiling/profiling" }

uuid = { version = "1.23.0", features = ["v4", "fast-rng", "serde"] }
getrandom = "0.4.2"
blake3 = "1.5.3"
sha2 = "0.10.9"
base64 = "0.22.1"
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
clap = { version = "4.5.60", features = ["derive", "cargo"] }
reqwest = { version = "0.12.28", default-features = false, features = [
	"blocking",
	"rustls-tls",
	"json",
] }

clap-verbosity-flag = "2.2.3"
crossbeam-channel = "0.5.15"
derive-from-one = "0.1.0"
roblox_install = "1.0.0"
panic-message = "0.3.0"
actix-msgpack = "0.1.4"
puffin_http = "0.16.0"
serde_json = { version = "1.0.149", features = ["float_roundtrip", "preserve_order"] }
indexmap = "2.13.0"
env_logger = "0.11.6"
directories = "5.0.1"
lazy_static = "1.5.0"
backtrace = "0.3.76"
documented = "0.9.2"
dialoguer = "0.12.0"
path-clean = "1.0.1"
rmp-serde = "1.3.1"
zstd = "0.13.3"
actix-web = "4.13.0"
actix-files = "0.6.10"
optfield = "0.4.0"

puffin = "0.19.0"
colored = "2.2.0"
anyhow = "1.0.103"
chrono = "0.4.44"
ctrlc = { version = "3.5.2", features = ["termination"] }
toml = "0.9.12"
open = "5.3.3"
log = "0.4.29"
notify = "8.2.0"
unicode-normalization = "0.1.24"

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "0.0.26", features = ["user"] }
windows-sys = { version = "0.59.0", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[dev-dependencies]
approx = "0.5.1"
rbx_binary = { version = "2.0.1", path = "crates/rbx_binary", features = ["unstable_text_format"] }
