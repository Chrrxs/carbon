name: CI

on:
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  checks:
    name: Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare current Studio reflection
        run: ./scripts/update-reflection --prepare
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format Rust
        run: cargo fmt --all -- --check
      - name: Install pinned Rust advisory scanner
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --deny unsound --deny yanked
      - name: Test Rust
        run: cargo test --locked --all-targets --verbose
      - name: Test standalone rbx_binary boundary
        run: |
          cargo test --locked -p rbx_binary --no-run
          cargo test --locked -p rbx_binary --doc
          cargo test --locked -p rbx_binary tests::serializer
      - name: Validate release suite
        run: cargo run --locked --bin carbon-qualify -- validate qualification/suites/carbon-release.json
      - name: Test repository workflows
        run: |
          ./scripts/test-build-optimization
          ./scripts/test-rml-build-optimization
          ./scripts/test-release-installer
          ./scripts/test-release-workflow
          ./scripts/test-public-readiness
          ./scripts/test-production-readiness-isolation
          ./scripts/test-change-workflow

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.302"
      - name: Test managed RML
        run: |
          dotnet test rml/code/dotnet/Runtime/Runtime.slnx -c Release --nologo
          dotnet test rml/code/dotnet/Roblox/Roblox.slnx -c Release --nologo
          dotnet test rml/code/dotnet/CarbonBridge.Tests/CarbonBridge.Tests.csproj -c Release --nologo

      - name: Install Rokit
        shell: bash
        run: |
          installer="$RUNNER_TEMP/rokit-install.sh"
          curl -sSfL \
            https://raw.githubusercontent.com/rojo-rbx/rokit/2f2618428ef31279e2fc80b0b1d73485bc929ddd/scripts/install.sh \
            -o "$installer"
          echo "4f180e0e19494c02085d43765f731d03e1ae172e00dfcce0a56fbd6598a40b30  $installer" |
            sha256sum --check
          bash "$installer"
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Install plugin toolchain
        working-directory: studio-plugin
        run: rokit install --no-trust-check
      - name: Test current Studio reflection
        run: ./scripts/update-reflection --check
      - name: Test live reflection policy
        working-directory: studio-plugin
        run: lune run scripts/test-live-reflection-database.luau
      - name: Lint Studio plugin
        working-directory: studio-plugin
        run: selene src
      - name: Format Studio plugin
        working-directory: studio-plugin
        run: stylua src scripts --check
      - name: Build automatically versioned plugin
        run: ./scripts/build-studio-plugin target/Carbon.rbxm

  windows:
    name: Native Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare current Studio reflection
        shell: bash
        run: ./scripts/update-reflection --prepare
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build and test every Rust target
        run: cargo test --locked --all-targets --verbose

      - name: Configure native RML
        run: >
          cmake -S rml -B rml/build/ci -A x64
          -DROBLOX_MODLOADER_BUILD_MANAGED_PROJECTS=OFF
          -DROBLOX_MODLOADER_USE_CMAKE_CSHARP=OFF
          -DROBLOX_MODLOADER_BUILD_PROXY_GENERATOR=OFF
          -DROBLOX_MODLOADER_BUILD_PROXY_DLL=OFF
          -DROBLOX_MODLOADER_BUILD_DUMPER=OFF
          -DROBLOX_MODLOADER_BUILD_EXAMPLES=OFF
      - name: Build native RML and tests
        run: >
          cmake --build rml/build/ci --config Release --target
          roblox_modloader
          instance_child_reorder_tests
          hierarchy_capture_fast_path_tests
          serialized_property_event_gate_tests
          foreground_activation_policy_tests
          job_registry_tests
          reflection_runtime_resolver_tests
          datamodel_rtti_capability_tests
          offline_abi_resolver_tests
      - name: Test native RML
        run: >
          ctest --test-dir rml/build/ci -C Release --output-on-failure
          -R "^(instance_child_reorder|hierarchy_capture_fast_path|serialized_property_event_gate|foreground_activation_policy|job_registry|reflection_runtime_resolver|datamodel_rtti_capability|offline_abi_resolver)$"
